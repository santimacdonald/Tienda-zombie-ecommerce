<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Mart: Last Stand Outfitters</title>
    <style>
        /* Variables de color y estilo - Ambientación Apocalíptica */
        :root {
            --bg-base: #101010;
            --bg-surface: #1a1a1a;
            --toxic-green: #39ff14;
            --muted-green: #2b5329;
            --text-main: #e0e0e0;
            --text-secondary: #888888;
            --border-rust: #4a4a4a;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            /* Efecto de viñeta oscura */
            background-image: radial-gradient(circle at center, #1b241b 0%, #0a0a0a 100%);
            min-height: 100vh;
        }

        /* Cabecera */
        header {
            background-color: #050505;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--muted-green);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        header h1 {
            margin: 0;
            color: var(--toxic-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        /* Panel del Carrito */
        #cart-panel {
            background-color: rgba(26, 26, 26, 0.9);
            padding: 10px 20px;
            border: 1px solid var(--muted-green);
            border-radius: 4px;
            font-weight: bold;
            color: var(--toxic-green);
        }

        /* Contenedor Principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Filtros */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        button.filter-btn {
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-rust);
            padding: 10px 25px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        button.filter-btn:hover, button.filter-btn.active {
            border-color: var(--toxic-green);
            color: var(--toxic-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2) inset;
        }

        /* Grilla de Productos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Tarjeta de Producto */
        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-rust);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--muted-green);
        }

        /* Textura de desgaste simulada */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 5px,
                rgba(0,0,0,0.05) 5px,
                rgba(0,0,0,0.05) 10px
            );
            pointer-events: none;
        }

        .card h3 {
            margin-top: 0;
            color: #ffffff;
            border-bottom: 1px dashed var(--border-rust);
            padding-bottom: 10px;
            font-size: 1.2rem;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            flex-grow: 1;
            line-height: 1.4;
        }

        .price {
            font-size: 1.4rem;
            color: var(--toxic-green);
            font-weight: bold;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge {
            position: absolute;
            top: -10px;
            right: 15px;
            background-color: var(--bg-base);
            border: 1px solid var(--border-rust);
            color: var(--text-secondary);
            padding: 4px 10px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        button.add-btn {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--toxic-green);
            color: var(--toxic-green);
            padding: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button.add-btn:hover {
            background-color: var(--toxic-green);
            color: var(--bg-base);
        }

        /* Notificación temporal de "Añadido" */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--toxic-green);
            color: var(--bg-base);
            padding: 10px 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Z-Mart</h1>
        <div id="cart-panel">
            📦 Suministros: <span id="cart-count">0</span> | Total: 💰 <span id="cart-total">0</span> Chapas
        </div>
    </header>

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" onclick="filterProducts('Todas')">Inventario Completo</button>
            <button class="filter-btn" onclick="filterProducts('Arma')">Armas</button>
            <button class="filter-btn" onclick="filterProducts('Refugio')">Refugio</button>
            <button class="filter-btn" onclick="filterProducts('Cura')">Bio-Soporte (Curas)</button>
        </div>

        <div class="grid" id="product-grid">
            </div>
    </div>

    <div id="toast" class="toast">¡Suministro asegurado!</div>

    <script>
        // 1. Base de Datos / Array de Productos (Registro principal)
        const products = [
            {
                id_producto: 'PROD-001',
                nombre: 'Machete de Carbono',
                descripcion: 'Hoja ultra afilada y silenciosa. Ideal para encuentros cuerpo a cuerpo sin alertar a la horda.',
                categoria: 'Arma',
                precio_trueque: 150
            },
            {
                id_producto: 'PROD-002',
                nombre: 'Ballesta Táctica',
                descripcion: 'Incluye mira de visión nocturna y 5 virotes de titanio recuperables.',
                categoria: 'Arma',
                precio_trueque: 450
            },
            {
                id_producto: 'PROD-003',
                nombre: 'Malla Electrificada',
                descripcion: 'Sistema de defensa perimetral de alto voltaje alimentado por paneles solares.',
                categoria: 'Refugio',
                precio_trueque: 800
            },
            {
                id_producto: 'PROD-004',
                nombre: 'Placas de Blindaje',
                descripcion: 'Refuerzos opacos para puertas y ventanas. Aislan el ruido y bloquean la luz interior.',
                categoria: 'Refugio',
                precio_trueque: 200
            },
            {
                id_producto: 'PROD-005',
                nombre: 'Suero Estabilizador Z-X',
                descripcion: 'Detiene el avance de la infección por 24 horas. Administración intravenosa inmediata.',
                categoria: 'Cura',
                precio_trueque: 1200
            },
            {
                id_producto: 'PROD-006',
                nombre: 'Botiquín de Trauma',
                descripcion: 'Suministros médicos tácticos. Incluye antibióticos de amplio espectro y suturas.',
                categoria: 'Cura',
                precio_trueque: 350
            }
        ];

        // 2. Estado del Carrito
        let cart = [];

        // Referencias al DOM
        const productGrid = document.getElementById('product-grid');
        const cartCountUI = document.getElementById('cart-count');
        const cartTotalUI = document.getElementById('cart-total');
        const toast = document.getElementById('toast');

        // 3. Función para Renderizar los Productos en el HTML
        function renderProducts(items) {
            productGrid.innerHTML = ''; // Limpiar la grilla antes de renderizar

            if (items.length === 0) {
                productGrid.innerHTML = '<p>No hay suministros disponibles en esta categoría.</p>';
                return;
            }

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="badge">${product.categoria}</span>
                    <h3>${product.nombre}</h3>
                    <p>${product.descripcion}</p>
                    <div class="price">
                        <span>💰</span> ${product.precio_trueque} Chapas
                    </div>
                    <button class="add-btn" onclick="addToCart('${product.id_producto}')">
                        Añadir al Carrito
                    </button>
                `;
                productGrid.appendChild(card);
            });
        }

        // 4. Lógica de Filtrado por Categoría
        function filterProducts(category) {
            // Actualizar estilo visual de los botones
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (
                    btn.innerText.includes(category) || 
                    (category === 'Todas' && btn.innerText.includes('Inventario'))
                ) {
                    btn.classList.add('active');
                }
            });

            // Filtrar el array
            if (category === 'Todas') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.categoria === category);
                renderProducts(filtered);
            }
        }

        // 5. Lógica del Carrito de Compras
        function addToCart(productId) {
            const product = products.find(p => p.id_producto === productId);
            if (product) {
                cart.push(product);
                updateCartUI();
                showToast();
            }
        }

        function updateCartUI() {
            // Actualizar cantidad de ítems
            cartCountUI.innerText = cart.length;
            
            // Calcular el total de chapas usando reduce
            const total = cart.reduce((sum, item) => sum + item.precio_trueque, 0);
            cartTotalUI.innerText = total;
        }

        function showToast() {
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        // Inicializar la tienda cargando todos los productos al arrancar
        renderProducts(products);
    </script>
</body>
</html>
